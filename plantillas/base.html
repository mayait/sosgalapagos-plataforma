{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#ffffff">
  <title>{% block titulo %}Mapa de riesgos{% endblock %} · SOS Galápagos</title>
  <meta name="description" content="Reportes ciudadanos de lugares de riesgo en Galápagos. Información preliminar, no oficial. Emergencias: 911.">
  <link rel="manifest" href="{% url 'reportes:manifiesto_app' %}">
  <link rel="icon" href="{% static 'marca/usfq-isotipo-color.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'app/icono-192.png' %}">
  {% block estilos %}{% endblock %}
  <link rel="stylesheet" href="{% static 'mapa/estilos.css' %}">
</head>
<body class="{% block clase_cuerpo %}{% endblock %}">
  <div class="aviso" role="note">
    <span><strong>Información ciudadana preliminar, no oficial.</strong> Emergencias: <a href="tel:911">911</a></span>
  </div>
  {% include "parciales/iconos.html" %}
  {% block contenido %}{% endblock %}
  {% block guiones %}{% endblock %}
</body>
</html>
