# SOS Galápagos · mapa de riesgos (plataforma de reportes) en producción.
#
# Es un proyecto de Compose APARTE del sitio (nombre distinto), a propósito:
#   - el despliegue del sitio usa «--remove-orphans» y borraría estos contenedores si
#     compartieran proyecto;
#   - levantar o actualizar esto no reinicia nada del sitio.
# Se conecta a la red del sitio para que su Caddy alcance a «plataforma:8000».
#
# Uso (en el servidor, con el repo en /opt/sosgalapagos-plataforma):
#   despliegue/produccion/desplegar.sh
name: sosgalapagos-plataforma

x-plataforma: &plataforma
  build:
    context: ../..
    dockerfile: despliegue/Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    - BD_ANFITRION=postgis
    - BD_NOMBRE=${POSTGRES_DB:-plataforma}
    - BD_USUARIO=${POSTGRES_USER:-plataforma}
    - BD_CLAVE=${POSTGRES_PASSWORD}
    # Clima: esta aplicación recoge todas las fuentes y escribe en su base. Las direcciones y llaves
    # de cada fuente (CLIMA_…) están en el .env del servidor, nunca en el repositorio.
    - CLIMA_RECOGER=1
    - CLIMA_SALIDA=/srv/clima/datos
    - MEDIOS_DIR=/medios
    - RELIEVE_DIR=/relieve
  volumes:
    - medios:/medios
    # La carpeta que publica el servidor en /clima/: aquí se escriben los datos del panel y las descargas.
    - /srv/sosgalapagos-clima:/srv/clima
    # Relieve propio del 3D (teselas de cota). Se sube con rsync; ver despliegue/servidor.md.
    - /srv/sosgalapagos-relieve3d:/relieve:ro
  depends_on:
    postgis:
      condition: service_healthy

services:
  postgis:
    build: ../postgis
    restart: unless-stopped
    env_file: .env
    volumes:
      - bd:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  plataforma:
    <<: *plataforma
    command: sh -c "python manage.py migrate --noinput && gunicorn plataforma.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    expose: ['8000']
    networks: [default, sitio]

  trabajador:
    <<: *plataforma
    command: python manage.py db_worker

  reloj:
    <<: *plataforma
    command: python manage.py reloj

  # Satélite GOES-19: una pasada cada 5 minutos. Va aparte porque cada pasada tarda hasta 3 minutos
  # y no debe frenar la cola de tareas. Con poca prioridad y memoria acotada.
  satelite:
    <<: *plataforma
    command: nice -n 10 python manage.py clima_satelite --bucle
    mem_limit: 768m

volumes:
  bd:
  medios:

networks:
  # La red del Compose del sitio (proyecto «sosgalapagos»): ahí está su Caddy.
  sitio:
    external: true
    name: sosgalapagos_default
